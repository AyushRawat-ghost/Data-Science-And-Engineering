x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-custom-airflow-pyspark:latest}
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: super-secret
    AIRFLOW__WEBSERVER__EXPOSE_HOST_PORT: 'true'
    JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
    SPARK_HOME: "/home/airflow/.local/lib/python3.11/site-packages/pyspark"
    KAFKA_BROKER: kafka:9092
    # Add HBase/HDFS configuration for PySpark client access
    HADOOP_CONF_DIR: /etc/hadoop/conf # This is a common path inside Hadoop containers
    HBASE_CONF_DIR: /etc/hbase/conf
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./config/airflow.cfg:/opt/airflow/airflow.cfg
    - ./local_datalake:/opt/airflow/local_datalake
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_started
    hbase-master:
      condition: service_started
    # --- CRITICAL ADDITION ---
    vector-db: 
      condition: service_started
    # -------------------------

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command: ["-c", "airflow db migrate && airflow users create --username airflow --password airflow --firstname Airflow --lastname User --role Admin --email admin@example.com"]

  airflow-webserver:
    <<: *airflow-common
    command: ["airflow", "webserver"]
    ports:
      - "8080:8080"
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: ["airflow", "scheduler"]
    restart: always
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    restart: always

  # --- HADOOP/HBASE CORE INFRA ---
  hadoop-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    hostname: namenode
    container_name: namenode
    ports:
      - "9870:9870"
    environment:
      CLUSTER_NAME: hadoop-cluster
    # command: ["/bin/bash", "-c", "hdfs namenode -format -force -nonInteractive && /entrypoint.sh /run.sh"]
    restart: always

  hadoop-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode
    container_name: datanode
    depends_on:
      - hadoop-namenode
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    restart: always

  hbase-master:
    image: harisekhon/hbase
    hostname: hbase-master
    container_name: hbase-master
    ports:
      - "16010:16010"
    environment:
      HBASE_CONF_hbase_rootdir: hdfs://namenode:9000/hbase
      HBASE_CONF_hbase_zookeeper_quorum: zookeeper
    depends_on:
      - hadoop-namenode
      - zookeeper
    restart: always

  hbase-regionserver: # CRITICAL ADDITION: The data handler
    image: harisekhon/hbase
    hostname: hbase-regionserver
    container_name: hbase-regionserver
    environment:
      HBASE_CONF_hbase_rootdir: hdfs://namenode:9000/hbase
      HBASE_CONF_hbase_zookeeper_quorum: zookeeper
    depends_on:
      - hbase-master
      - hadoop-datanode
    restart: always
  
  # --- VECTOR DB FOR RAG ---

  vector-db:
    image: semitechnologies/weaviate:1.24.0
    hostname: weaviate
    container_name: weaviate
    ports:
      - "8081:8080"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      ENABLE_MODULES: 'text2vec-palm'
      QUERY_MAX_MEMORY: 4000000000
      DEFAULT_VECTORIZER_MODULE: 'text2vec-palm'
      # CRITICAL: Point Weaviate to the new model server hostname
      PALM_API_KEY: ${GEMINI_API_KEY_SECRET}
    volumes: # <--- CRITICAL ADDITION
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/meta"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
volumes:
  weaviate_data:
    driver: local